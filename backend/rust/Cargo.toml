[package]
name = "railflow-backend"
version = "0.1.0"
edition = "2021"
authors = ["Railflow Team"]
description = "Railflow control plane backend — Rust-powered deployment platform"
license = "MIT"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["ws", "macros", "multipart"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "limit"] }

# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }

# Docker SDK
bollard = "0.17"

# Authentication
jsonwebtoken = "9.3"
argon2 = "0.5"
totp-rs = { version = "^5.5", features = ["qr", "gen_secret"] }
rand = "0.8"
hex = "0.4"
base64 = "0.22"

# System info
sysinfo = "0.31"

# HTTP client (for GitHub API)
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Errors & logging
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
async-trait = "0.1"
once_cell = "1.20"
regex = "1.11"
url = "2.5"
sha2 = "0.10"
hmac = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
