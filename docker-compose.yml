# ============================================================
# Railflow — Full-stack production deployment
# Usage:
#   1. cp .env.example .env  &&  edit secrets
#   2. docker compose up -d
#   3. Visit https://localhost (or your domain)
# ============================================================

services:
  # ---------- PostgreSQL ----------
  postgres:
    image: postgres:17-alpine
    container_name: railflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: railflow
      POSTGRES_USER: railflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-railflow_secret_change_me}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railflow -d railflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - railflow-net
    # Don't expose to host in production — access via backend only
    # ports:
    #   - "5432:5432"

  # ---------- Redis ----------
  redis:
    image: redis:7.4-alpine
    container_name: railflow-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - railflow-net

  # ---------- Rust Backend ----------
  backend:
    build:
      context: ./backend/rust
      dockerfile: Dockerfile
    container_name: railflow-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://railflow:${POSTGRES_PASSWORD:-railflow_secret_change_me}@postgres:5432/railflow
      REDIS_URL: redis://redis:6379/0
      DOCKER_SOCKET: /var/run/docker.sock
      RUST_LOG: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      # Mount Docker socket so backend can manage containers
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend/rust/migrations:/app/migrations:ro
    networks:
      - railflow-net

  # ---------- Next.js Frontend ----------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: railflow-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - railflow-net

  # ---------- Caddy Edge Proxy (auto-TLS + security headers) ----------
  caddy:
    image: caddy:2.8-alpine
    container_name: railflow-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - railflow-net

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  railflow-net:
    driver: bridge
